<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - DentalCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/fluent-emoji-flat:tooth.svg">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card shadow-lg border-0 rounded-4" style="max-width:440px; width:100%;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-teal-custom rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width:70px;height:70px;">
                        <i class="fa-solid fa-key text-white fs-2"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Recuperar contraseña</h2>
                    <p class="text-muted mb-0">Te enviaremos un enlace a tu correo</p>
                </div>

                <div id="alerta-enviado" class="alert alert-success d-none">
                    Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada (y spam).
                </div>

                <form action="SolicitarRecuperacion.php" method="POST">
                    <div class="mb-3">
                        <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" autocomplete="email" class="form-control py-2 rounded-3 focus-teal" placeholder="correo@ejemplo.com" required>
                    </div>
                    <button type="submit" class="btn bg-teal-custom text-white w-100 py-2 shadow-sm">
                        Enviar enlace
                    </button>
                    <a href="Login.php" class="btn btn-link w-100 mt-2 text-teal-custom">Volver a Iniciar Sesión</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('enviado') === '1') {
            document.getElementById('alerta-enviado').classList.remove('d-none');
        }
    </script>
</body>
</html>
