<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - DentalCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/fluent-emoji-flat:tooth.svg">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card shadow-lg border-0 rounded-4" style="max-width:440px; width:100%;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-teal-custom rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width:70px;height:70px;">
                        <i class="fa-solid fa-lock text-white fs-2"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Nueva contraseña</h2>
                </div>

                <div id="alerta-error" class="alert alert-danger d-none"></div>

                <form id="form-restablecer" action="RestablecerPassword.php" method="POST">
                    <input type="hidden" id="token" name="token">
                    <div class="mb-3">
                        <label for="nueva" class="form-label fw-semibold">Nueva contraseña</label>
                        <input type="password" id="nueva" name="nueva" autocomplete="new-password" class="form-control py-2 rounded-3 focus-teal" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirmar" class="form-label fw-semibold">Confirmar contraseña</label>
                        <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" class="form-control py-2 rounded-3 focus-teal" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn bg-teal-custom text-white w-100 py-2 shadow-sm">
                        Restablecer contraseña
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        document.getElementById('token').value = token;

        const error = params.get('error');
        if (error) {
            const alerta = document.getElementById('alerta-error');
            alerta.textContent = decodeURIComponent(error);
            alerta.classList.remove('d-none');
        }
        if (!token) {
            const alerta = document.getElementById('alerta-error');
            alerta.textContent = 'Enlace inválido. Solicita uno nuevo desde la pantalla de recuperación.';
            alerta.classList.remove('d-none');
            document.getElementById('form-restablecer').classList.add('d-none');
        }
    </script>
</body>
</html>
